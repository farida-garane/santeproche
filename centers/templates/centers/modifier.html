{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>Modifier mon centre</h1>
    <p>Mettez à jour les informations de votre établissement</p>
</div>
<div class="card" style="max-width:560px;">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
    </form>
</div>
{% endblock %}
