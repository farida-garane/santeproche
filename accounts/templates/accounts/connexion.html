{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <h1>Connexion</h1>
        <p class="auth-subtitle">Accédez à votre espace SantéProche</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">Se connecter</button>
        </form>
        <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-secondary);">
            Pas encore de compte ? <a href="{% url 'inscription' %}">S'inscrire</a>
        </p>
    </div>
</div>
{% endblock %}
